spring.application.name=monitor
# PostgreSQL Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/apex_monitor
spring.datasource.username=apex_user
spring.datasource.password=apex_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true



#KAFKA


# Tell Spring Boot where your local Kafka broker is running
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# KAFKA CONSUMER PROPERTIES ---
spring.kafka.consumer.group-id=apex-monitor-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer




#Apache


# Configure for API Keys for Apache
alpaca.api.key.id=${ALPACA_KEY_ID}
alpaca.api.secret.key=${ALPACA_SECRET_KEY}

#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379